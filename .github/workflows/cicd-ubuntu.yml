name: cicd-ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "Makefile"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/cicd-ubuntu.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  all:
    strategy:
      fail-fast: false
      matrix:
        # Quoted: an unquoted 3.10-style number would parse as a float
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          python -m pip install --upgrade pip
          make install-python

      - name: get-binaryen
        run: make get-binaryen

      - name: all-tests
        run: make all-tests

      - name: wheel smoke test
        run: |
          make pypi-build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest==8.3.4 wasmtime==29.0.0
          /tmp/clean/bin/pytest -vv test/smoke

      # The early manylinux check: does the relinked official .a satisfy a
      # manylinux policy? (HANDOVER Linux caveat)
      - name: auditwheel show
        run: |
          python -m pip install auditwheel
          auditwheel show dist/*.whl
