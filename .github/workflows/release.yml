name: release

# Tag-triggered wheel build + publish to PyPI via trusted publishing.
# The wheels are platform-specific (bundled libbinaryen) and are ONLY ever
# built and published here — never uploaded from a laptop.
#
# Maintainer prerequisites (one-time):
# - PyPI project `icpp-binaryen` with a trusted publisher for this repo,
#   workflow `release.yml`, environment `pypi`.
# - GitHub environment `pypi` on this repo.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: install
        run: |
          python -m pip install --upgrade pip
          make install-python

      - name: get-binaryen
        run: make get-binaryen

      - name: build wheel
        run: make pypi-build

      # Retag linux_x86_64 to the manylinux policy the relinked lib satisfies
      - name: auditwheel repair (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel patchelf
          auditwheel repair dist/*.whl -w dist-repaired
          rm dist/*.whl
          mv dist-repaired/*.whl dist/

      - name: wheel smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest==8.3.4 wasmtime==29.0.0
          /tmp/clean/bin/pytest -vv test/smoke

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: list wheels
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
